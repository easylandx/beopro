<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#08080a}
body{margin:0;min-height:calc(100svh + 110px);background:radial-gradient(120% 70% at 50% 0%,#1b1b20 0%,#0b0b0e 55%,#060607 100%);color:#e9e7e2;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;touch-action:manipulation;overscroll-behavior-y:none;padding:calc(env(safe-area-inset-top,0px) + 102px) 0 calc(env(safe-area-inset-bottom,0px) + 40px)}
header{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;flex-direction:column;align-items:flex-start;gap:7px;padding:calc(env(safe-area-inset-top,0px) + 10px) 18px 10px;background:rgba(10,10,12,.62);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid rgba(255,255,255,.07)}
.hrow{display:flex;align-items:center;gap:10px}
.lang{display:inline-flex;align-items:center;gap:2px;padding:2px;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:inherit;font:inherit;cursor:pointer;-webkit-user-select:none;user-select:none}
.lang .opt{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 11px 0 8px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.1em;color:#8b8a86;transition:background .2s,color .2s}
.lang .opt svg{width:18px;height:12px;display:block;flex:none;border-radius:2px;opacity:.5;transition:opacity .2s}
.lang .opt.on{background:rgba(255,255,255,.15);color:#f3f1ec}
.lang .opt.on svg{opacity:1}
.lang:active .opt.on{background:rgba(255,255,255,.22)}
.lang:focus-visible{outline:2px solid rgba(255,255,255,.5);outline-offset:2px}
.ttl{font-size:19px;font-weight:300;letter-spacing:.14em;color:#f3f1ec}
.ttl b{font-weight:600}
header a{display:inline-flex;line-height:0}
.logo{width:26px;height:26px;border-radius:7px;display:block}
.stage{position:relative;width:min(92vw,520px);aspect-ratio:843/1264;margin:0 auto;border-radius:22px;overflow:hidden;background:#141416;box-shadow:0 30px 60px -20px rgba(0,0,0,.85),0 8px 18px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.07);cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s ease;pointer-events:none;-webkit-user-drag:none}
.stage img.on{opacity:1}
.spinwrap{position:absolute;left:31.55%;top:51.41%;width:22.55%;aspect-ratio:1;border-radius:50%;overflow:hidden;animation:spin 1.82s linear infinite;animation-play-state:paused;will-change:transform;pointer-events:none}
.spinwrap img{inset:0}
.playing .spinwrap{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}
.ctrls{position:absolute;right:4%;bottom:4%;z-index:6;display:flex;flex-direction:column;align-items:flex-end;gap:8px;opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .4s ease,transform .4s ease}
.ctrls.show{opacity:1;transform:none;pointer-events:auto}
.btn{width:42px;height:42px;flex:none;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(14,14,17,.55);-webkit-backdrop-filter:blur(14px) saturate(1.5);backdrop-filter:blur(14px) saturate(1.5);box-shadow:0 8px 20px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;padding:0;cursor:pointer;transition:transform .12s ease,background .2s}
@media(max-width:430px){.ctrls,.ctrls .row{gap:5px}.btn{width:34px;height:34px}.btn svg{width:16px;height:16px}}
.btn:active{transform:scale(.92);background:rgba(40,40,46,.7)}
.btn svg{width:19px;height:19px;fill:currentColor}
.btn.genre svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.info{width:min(92vw,520px);margin:18px auto 0;text-align:center;min-height:56px}
#track{font-size:16px;font-weight:400;letter-spacing:.02em;color:#f1efe9;line-height:1.35;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
#sub{margin-top:6px;font-size:12.5px;color:#8b8a86;letter-spacing:.06em;min-height:16px}
#scrim{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .3s}
#scrim.show{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-width:560px;margin:0 auto;max-height:72svh;display:flex;flex-direction:column;background:rgba(18,18,21,.92);-webkit-backdrop-filter:blur(26px) saturate(1.4);backdrop-filter:blur(26px) saturate(1.4);border:1px solid rgba(255,255,255,.09);border-bottom:0;border-radius:26px 26px 0 0;box-shadow:0 -20px 50px rgba(0,0,0,.6);transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom,0px)}
#sheet.show{transform:none}
.grab{width:38px;height:4px;border-radius:2px;background:rgba(255,255,255,.22);margin:10px auto 6px}
#sheet h2{margin:4px 22px 8px;font-size:15px;font-weight:500;letter-spacing:.04em;color:#cfcdc7}
#list{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 10px 14px}
#list button{display:flex;width:100%;align-items:center;justify-content:space-between;background:none;border:0;color:#e9e7e2;font:inherit;font-size:16px;text-align:left;padding:13px 12px;border-radius:12px;cursor:pointer}
#list button:active{background:rgba(255,255,255,.08)}
#list button.cur{background:rgba(255,255,255,.07);color:#fff}
#list button.cur::after{content:"";width:8px;height:8px;border-radius:50%;background:#e8e4da;box-shadow:0 0 10px rgba(232,228,218,.7)}
.search{width:min(92vw,520px);margin:6px auto 0;display:none}
.search.show{display:block}
#sForm{display:flex;gap:8px}
#q{flex:1;min-width:0;height:44px;border-radius:22px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#f1efe9;font:inherit;font-size:16px;padding-top:0;padding-bottom:0;padding-left:18px;padding-right:18px;outline:none;-webkit-appearance:none;appearance:none}
#q::placeholder{color:#7d7c78}
#q:focus{border-color:rgba(255,255,255,.32);background:rgba(255,255,255,.09)}
#sBtn{width:44px;height:44px;flex:none;border-radius:50%;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#fff;display:grid;place-items:center;padding:0;cursor:pointer}
#sBtn:active{background:rgba(255,255,255,.16)}
#sBtn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
#sBtn{position:relative}
.btn{position:relative}
[data-tip]::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%) translateY(4px);white-space:nowrap;padding:6px 10px;border-radius:8px;background:rgba(20,20,24,.94);border:1px solid rgba(255,255,255,.14);box-shadow:0 6px 16px rgba(0,0,0,.5);color:#f1efe9;font-size:12px;font-weight:400;letter-spacing:.03em;line-height:1.2;pointer-events:none;opacity:0;transition:opacity .15s ease,transform .15s ease;z-index:10}
#bFwd::after{left:auto;right:0;transform:translateY(4px)}
#bFwd:hover::after{transform:none}
.ctrls .row{display:flex;gap:8px}
.btn{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#bGenre::after,#bWa::after{left:auto;right:0;transform:translateY(4px)}
#bWa{width:44px;height:44px;flex:none;border-radius:50%;border:0;background:#25D366;color:#fff;display:grid;place-items:center;padding:0;cursor:pointer;position:relative;box-shadow:0 6px 16px rgba(37,211,102,.35);transition:transform .12s ease,opacity .2s,filter .2s}
#bWa:active{transform:scale(.92);filter:brightness(.9)}
#bWa.off{opacity:.45}
#bWa svg{width:24px;height:24px;fill:currentColor}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);transform:translate(-50%,12px);z-index:40;max-width:min(88vw,420px);padding:11px 16px;border-radius:14px;background:rgba(24,24,28,.96);border:1px solid rgba(255,255,255,.14);color:#f1efe9;font-size:14px;line-height:1.35;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (hover:hover){
[data-tip]:hover::after{opacity:1;transform:translateX(-50%)}
#bGenre:hover::after,#bWa:hover::after{transform:none}
}
.stage{transition:opacity .5s ease}
html.boot .stage{opacity:0}
html.boot .stage img,html.boot .ctrls{transition:none!important}
@media (prefers-reduced-motion:reduce){.stage img,.ctrls,#sheet{transition:none}}
</style>

  return fetchJSON('https://archive.org/metadata/'+encodeURIComponent(doc.identifier)).then(function(m){
    if(!doc.title&&m.metadata){var md=m.metadata;doc={identifier:doc.identifier,title:Array.isArray(md.title)?md.title[0]:md.title,creator:md.creator}}

      var k=f.name.toLowerCase().replace(/\.mp3$/,'').replace(/[_ -]?(64kb|128kb|256kb|vbr|lofi)$/,'');

  qs.forEach(function(ws){var s=0;ws.forEach(function(w){if(h.indexOf(' '+noAcc(w))>=0)s++});if(s>best)best=s});

  var base='mediatype:(audio) AND format:(MP3) AND ',qs=[];
  if(key.length>1)qs.push(base+'title:("'+key.join(' ')+'")');
  qs.push(base+key.map(function(w){return '(title:('+w+') OR creator:('+w+') OR subject:('+w+'))'}).join(' AND '));
  qs.push(base+'('+key.join(' AND ')+')');
  return Promise.all(qs.map(function(q){return aSearch(q,40).catch(function(){return null})})).then(function(rs){
    if(rs.every(function(r){return r===null}))throw new Error('net');
    var docs=[].concat.apply([],rs.map(function(r){return r||[]}));

  unlock();pendingPlay=false;
  var my=++token;loading=true;playing=false;try{audio.pause()}catch(e){}render();
  var tries=0;
  (function attempt(){
    (fixed?(typeof fixed==='function'?fixed():typeof fixed.then==='function'?fixed:Promise.resolve(fixed)):pickTrack(genre)).then(function(t){
      if(my!==token)return;

var ES_STOP={de:1,del:1,la:1,el:1,los:1,las:1,y:1,un:1,una:1,en:1,con:1,para:1,por:1,al:1,lo:1};
function noAcc(w){return w.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
function dictTranslate(text){
  var out=[],hit=false;
  text.split(/\s+/).filter(Boolean).forEach(function(w){
    var k=noAcc(w);
    if(ES[k]){out.push(ES[k]);hit=true}
    else if(ES_STOP[k]){/* drop Spanish filler words */}
    else out.push(w);
  });
  return hit?out.join(' '):text;
}
function toEnglish(text){
  var ctl=window.AbortController?new AbortController():null,timer=setTimeout(function(){if(ctl)ctl.abort()},4000);
  return fetch('https://api.mymemory.translated.net/get?langpair='+encodeURIComponent('es|en')+'&q='+encodeURIComponent(text),ctl?{signal:ctl.signal}:{})
    .then(function(r){if(!r.ok)throw new Error('http');return r.json()})
    .then(function(j){
      clearTimeout(timer);
      var t=j&&j.responseData&&j.responseData.translatedText;
      if(!t||/MYMEMORY|INVALID|QUERY LENGTH/i.test(t)||j.responseStatus!==200)throw new Error('bad');
      return t;
    })
    .catch(function(){clearTimeout(timer);return dictTranslate(text)});
}
function firstPlayable(docs,i,qw){
  return trackFromDoc(docs[i],true,undefined,qw).catch(function(err){
    if(i+1<docs.length&&i<7)return firstPlayable(docs,i+1,qw);
    throw err;
  });
}
$('#sForm').addEventListener('submit',function(e){
  e.preventDefault();
  var text=qEl.value.trim();if(!text)return;
  unlock();buzz(10);qEl.blur();var my=++sTok;
  setStatus('searching');subEl.textContent='';
  /* search exactly what was typed (names, titles) and, in parallel, its English translation */
  var pOrig=searchArchive(text).then(function(d){return {d:d}},function(){return {err:1}});
  toEnglish(text).then(function(en){
    if(my!==sTok)return null;
    var same=noAcc(en)===noAcc(text);
    if(!same)setStatus('searchingFor',en);
    var pEn=same?Promise.resolve(null):searchArchive(en).then(function(d){return {d:d}},function(){return {err:1}});
    return Promise.all([pOrig,pEn]).then(function(r){
      if(my!==sTok)return null;
      var a=r[0],b=r[1];
      if(a.err&&(!b||b.err))throw new Error('net');
      var qs=[keyWords(text)];if(!same)qs.push(keyWords(en));
      return {docs:rankDocs([].concat(a.d||[],(b&&b.d)||[]),qs),qs:qs};
    });
  }).then(function(res){
    if(!res||my!==sTok)return;
    if(!res.docs.length){setStatus('none');return}
    var qw=[];res.qs.forEach(function(ws){ws.forEach(function(w){var n=noAcc(w);if(qw.indexOf(n)<0)qw.push(n)})});
    discTaps=1;searchDocs=res.docs;searchIdx=0;searchQW=qw;
    playRandom(firstPlayable(res.docs,0,qw));
  }).catch(function(){if(my===sTok)setStatus('sFail')});
});

/* ---------- WhatsApp share ---------- */
var SITE='https://easylandx.github.io/beopro/',shareImg=null,shareP=null,toastT=0;
function toast(msg,ms){var t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show')},ms||4500)}
function imgReady(im){return im.complete&&im.naturalWidth?Promise.resolve():new Promise(function(ok,no){im.addEventListener('load',ok,{once:true});im.addEventListener('error',no,{once:true})})}
function canvasBlob(c,type,q){return new Promise(function(ok,no){c.toBlob(function(b){b?ok(b):no(new Error('blob'))},type,q)})}
/* closed turntable + record, composed from the stage layers */
function buildShareImage(){
  if(shareP)return shareP;
  shareP=Promise.all([imgReady(el.i6),imgReady(el.d6)]).then(function(){
    var nw=el.i6.naturalWidth,nh=el.i6.naturalHeight,sc=Math.min(1,1000/nw),W=Math.round(nw*sc),H=Math.round(nh*sc);
    var c=document.createElement('canvas');c.width=W;c.height=H;var x=c.getContext('2d');
    x.drawImage(el.i6,0,0,W,H);
    var d=W*.2255,dx=W*.3155,dy=H*.5141,iw=el.d6.naturalWidth,ih=el.d6.naturalHeight,m=Math.min(iw,ih);
    x.save();x.beginPath();x.arc(dx+d/2,dy+d/2,d/2,0,Math.PI*2);x.clip();
    x.drawImage(el.d6,(iw-m)/2,(ih-m)/2,m,m,dx,dy,d,d);x.restore();
    return Promise.all([canvasBlob(c,'image/png'),canvasBlob(c,'image/jpeg',.9)]);
  }).then(function(r){shareImg={png:r[0],jpg:r[1]};return shareImg}).catch(function(){shareP=null;return null});
  return shareP;
}
function shareLink(){return SITE+'?a='+encodeURIComponent(current.doc.identifier)+'&n='+current.idx}
function shareText(){
  var name=current.title+(current.creator?' – '+current.creator:'');
  return t('share')+'\n\n'+name+'\n'+shareLink();
}
var IS_MOBILE=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function doShareWA(){
  if(!(current&&current.doc&&current.doc.identifier)||loading){toast(t('playFirst'));return}
  buzz(12);
  var text=shareText(),enc=encodeURIComponent(text);
  if(IS_MOBILE){
    var f=shareImg&&window.File?new File([shareImg.jpg],'beopro.jpg',{type:'image/jpeg'}):null;
    if(f&&navigator.share&&navigator.canShare&&navigator.canShare({files:[f]})){
      navigator.share({files:[f],text:text}).catch(function(e){if(e&&e.name==='AbortError')return;window.location.href='https://wa.me/?text='+enc});
    }else window.location.href='https://wa.me/?text='+enc;
    return;
  }
  var mac=/Mac/i.test(navigator.platform),key=mac?'⌘V':'Ctrl+V';
  if(shareImg&&navigator.clipboard&&window.ClipboardItem){
    navigator.clipboard.write([new ClipboardItem({'image/png':shareImg.png})])
      .then(function(){toast(t('copied',key),7000)})
      .catch(function(){toast(t('copyFail'),6000)});
  }else toast(t('copyFail'),6000);
  window.open('https://web.whatsapp.com/send?text='+enc,'_blank','noopener');
}
$('#bWa').addEventListener('click',doShareWA);
buildShareImage();

/* ---------- shared link: ?a=<archive id>&n=<track> ---------- */
(function(){
  var q;try{q=new URLSearchParams(location.search)}catch(e){return}
  var a=q.get('a');if(!a||!/^[A-Za-z0-9][\w.\-]*$/.test(a))return;
  var n=parseInt(q.get('n'),10);if(!(n>=0))n=0;
  var h=document.documentElement,shown=false;
  function reveal(){if(shown)return;shown=true;requestAnimationFrame(function(){h.classList.remove('boot')})}
  state=3;spun=true;discTaps=1;render();
  var imgs=[el.i1,el.i2,el.i3,el.i5,el.d5];
  Promise.all(imgs.map(function(im){return im.decode?im.decode().catch(function(){}):imgReady(im)})).then(reveal,reveal);
  setTimeout(reveal,2500);
  playRandom(function(){
    return trackFromDoc({identifier:a},false,n).then(function(t){t.shared=true;return t});
  });
})();
